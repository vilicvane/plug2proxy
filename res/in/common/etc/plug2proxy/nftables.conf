#!/usr/sbin/nft -f
#
# plug2proxy TPROXY nftables configuration
#
# This configuration intercepts TCP and UDP traffic and redirects it to
# plug2proxy via TPROXY for transparent proxying.
#
# IMPORTANT: Before using this, you need to set up policy routing:
#   ip route add local default dev lo table 100
#   ip rule add fwmark 1 table 100
#
# For IPv6:
#   ip -6 route add local default dev lo table 100
#   ip -6 rule add fwmark 1 table 100
#
# The routing rules are automatically set up by the networkd-dispatcher script
# at /etc/networkd-dispatcher/routable.d/plug2proxy
#
# NOTE ON TPROXY FOR LOCAL TRAFFIC:
# Due to a Netfilter feature, marking packets in the OUTPUT chain with a
# routing mark causes them to be RE-ROUTED back through PREROUTING!
#
# The flow for locally-originated traffic:
# 1. OUTPUT chain marks packet with fwmark 1 (proxy_mark)
# 2. Policy routing: fwmark 1 → table 100 → local default dev lo
# 3. Packet is re-routed and goes through PREROUTING
# 4. TPROXY in PREROUTING intercepts and redirects to plug2proxy
#
# This works for BOTH TCP and UDP locally-originated traffic!
#
# Reference: https://guide.v2fly.org/app/tproxy.html

# Ensure tables exist (for atomic reload)
table ip plug2proxy {}
table ip6 plug2proxy {}

# Clear existing rules
flush table ip plug2proxy
flush table ip6 plug2proxy

# =============================================================================
# Configuration Variables
# =============================================================================

# Fake IP ranges (must match plug2proxy fake_ip configuration)
define fake_ipv4_net = 198.18.0.0/15
define fake_ipv6_net = 2001:db8::/32

# Networks to exclude from proxying (private/reserved networks)
define excluding_ipv4_nets = {
    0.0.0.0/8,          # Current network
    10.0.0.0/8,         # Private (Class A)
    100.64.0.0/10,      # Carrier-grade NAT
    127.0.0.0/8,        # Loopback
    169.254.0.0/16,     # Link-local
    172.16.0.0/12,      # Private (Class B)
    192.0.0.0/24,       # IETF Protocol Assignments
    192.0.2.0/24,       # TEST-NET-1
    192.168.0.0/16,     # Private (Class C)
    198.51.100.0/24,    # TEST-NET-2
    203.0.113.0/24,     # TEST-NET-3
    224.0.0.0/4,        # Multicast
    240.0.0.0/4,        # Reserved
    255.255.255.255/32  # Broadcast
}

define excluding_ipv6_nets = {
    ::1/128,            # Loopback
    ::/128,             # Unspecified
    ::ffff:0:0/96,      # IPv4-mapped
    64:ff9b::/96,       # NAT64
    100::/64,           # Discard-only
    fe80::/10,          # Link-local
    fc00::/7,           # Unique local (ULA)
    ff00::/8            # Multicast
}

# Traffic marks:
# - proxy_mark (0x01): Traffic to be routed to TPROXY via policy routing
# - proxied_mark (0xff): Traffic FROM plug2proxy that bypasses interception
#
# IMPORTANT: proxied_mark MUST match the `mark` value in your plug2proxy config!
define proxy_mark = 0x01
define proxied_mark = 0xff

# TPROXY listener (plug2proxy's transparent proxy)
define tproxy_ipv4 = 127.0.0.1
define tproxy_ipv6 = ::1
define tproxy_port = 12345

# =============================================================================
# IPv4 Configuration
# =============================================================================

table ip plug2proxy {
    # -------------------------------------------------------------------------
    # OUTPUT chain - marks locally-generated traffic for TPROXY
    # -------------------------------------------------------------------------
    # Marked traffic is routed back to prerouting via policy routing
    # (fwmark 1 -> table 100 -> local).
    chain output {
        type route hook output priority filter; policy accept;

        # Skip excluded networks (private, loopback, etc.)
        ip daddr $excluding_ipv4_nets accept

        # Skip traffic already proxied by plug2proxy (prevents loops)
        meta mark $proxied_mark accept

        # Skip reply packets (established connections from proxy)
        ct direction reply accept

        # =====================================================================
        # TCP: Proxy ALL TCP traffic
        # =====================================================================
        meta l4proto tcp meta mark set $proxy_mark accept

        # =====================================================================
        # UDP: Proxy ALL UDP traffic
        # =====================================================================
        # Full UDP proxying - all UDP goes through tunnel
        meta l4proto udp meta mark set $proxy_mark accept
        #
        # Alternative: Proxy only fake IP UDP (safer, less intrusive)
        # Uncomment below and comment out the line above if you only want
        # to proxy UDP to fake IPs (from DNS resolution):
        # meta l4proto udp ip daddr $fake_ipv4_net meta mark set $proxy_mark accept
    }

    # -------------------------------------------------------------------------
    # PREROUTING chain - performs TPROXY redirection
    # -------------------------------------------------------------------------
    # Traffic arrives here from forwarding (router mode) or policy routing.
    chain prerouting {
        type filter hook prerouting priority filter; policy accept;

        # Skip excluded networks
        ip daddr $excluding_ipv4_nets accept

        # Skip traffic from plug2proxy
        meta mark $proxied_mark accept

        # TPROXY all TCP
        meta l4proto tcp tproxy to $tproxy_ipv4:$tproxy_port meta mark set $proxy_mark accept

        # TPROXY all UDP
        meta l4proto udp tproxy to $tproxy_ipv4:$tproxy_port meta mark set $proxy_mark accept
        #
        # Alternative: TPROXY only fake IP UDP
        # meta l4proto udp ip daddr $fake_ipv4_net tproxy to $tproxy_ipv4:$tproxy_port meta mark set $proxy_mark accept
    }

    # -------------------------------------------------------------------------
    # DIVERT chain - handles existing transparent socket connections
    # -------------------------------------------------------------------------
    # Marks packets for existing transparent sockets so they route correctly.
    # Without this, established connections break after initial handshake.
    chain divert {
        type filter hook prerouting priority mangle; policy accept;

        meta l4proto tcp socket transparent 1 meta mark set $proxy_mark accept
        meta l4proto udp socket transparent 1 meta mark set $proxy_mark accept
    }
}

# =============================================================================
# IPv6 Configuration
# =============================================================================

table ip6 plug2proxy {
    chain output {
        type route hook output priority filter; policy accept;

        ip6 daddr $excluding_ipv6_nets accept
        meta mark $proxied_mark accept
        ct direction reply accept

        # TCP: Proxy all
        meta l4proto tcp meta mark set $proxy_mark accept

        # UDP: Proxy all
        meta l4proto udp meta mark set $proxy_mark accept
        # Alternative: Proxy only fake IP UDP
        # meta l4proto udp ip6 daddr $fake_ipv6_net meta mark set $proxy_mark accept
    }

    chain prerouting {
        type filter hook prerouting priority filter; policy accept;

        ip6 daddr $excluding_ipv6_nets accept
        meta mark $proxied_mark accept

        meta l4proto tcp tproxy to $tproxy_ipv6:$tproxy_port meta mark set $proxy_mark accept

        meta l4proto udp tproxy to $tproxy_ipv6:$tproxy_port meta mark set $proxy_mark accept
        # Alternative: TPROXY only fake IP UDP
        # meta l4proto udp ip6 daddr $fake_ipv6_net tproxy to [$tproxy_ipv6]:$tproxy_port meta mark set $proxy_mark accept
    }

    chain divert {
        type filter hook prerouting priority mangle; policy accept;

        meta l4proto tcp socket transparent 1 meta mark set $proxy_mark accept
        meta l4proto udp socket transparent 1 meta mark set $proxy_mark accept
    }
}
