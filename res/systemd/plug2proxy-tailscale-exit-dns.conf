[Unit]
# Exit-node DNS is delivered to the host resolver by tailscaled. Keep the
# resolver alive and re-apply this runtime-only link policy after it restarts.
Wants=systemd-resolved.service
After=systemd-resolved.service
PartOf=systemd-resolved.service

[Service]
# The exit node itself must use `tailscale set --accept-dns=false`, leaving
# this drop-in as the sole owner of tailscale0's resolver state. The base
# service has already started the DNS listener and validated the TPROXY data
# plane at this point.
ExecStartPost=+/usr/bin/resolvectl dns tailscale0 127.0.0.1
ExecStartPost=+/usr/bin/resolvectl domain tailscale0 ~.

# Runtime resolver state follows the service and fails open to the physical
# link's original DNS if Plug2Proxy is stopped or fails during startup.
ExecStop=-+/usr/bin/resolvectl revert tailscale0
ExecStopPost=-+/usr/bin/resolvectl revert tailscale0
