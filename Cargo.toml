[package]
name = "plug2proxy"
version = "0.2.0"
edition = "2024"

[[bin]]
name = "plug2proxy"
path = "src/main.rs"

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"

[dependencies]
anyhow = "1.0.100"
async-stream = "0.3.6"
async-trait = "0.1.89"
clap = { version = "4.5.54", features = ["derive"] }
color-backtrace = "0.7.2"
colored = "3.0.0"
console-subscriber = "0.5.0"
derive_more = { version = "2.1.1", features = ["full"] }
enum_dispatch = "0.3.13"
env_logger = "0.11.8"
flume = "0.12.0"
futures = "0.3.31"
hickory-resolver = { version = "0.26", features = ["system-config"] }
hickory-server = { version = "0.26", features = ["resolver"] }
ipnet = { version = "2.11.0", features = ["serde"] }
itertools = "0.14.0"
json-strip-comments = "3.1.2"
libc = "0.2.180"
lits = "0.3.1"
log = { version = "0.4.29", features = ["release_max_level_debug"] }
lowkit = "0.1.0"
maxminddb = "0.27.1"
moka = { version = "0.12.12", features = ["sync"] }
pem = "3.0.6"
postcard = { version = "1.1.3", features = ["alloc"] }
prost = "0.14.1"
quiche = { git = "https://github.com/vilicvane/quiche", rev = "58b25af5c3ebf1721e03aee125365d3ff1b7b6e6" }
rand = "0.9.2"
rcgen = { version = "0.14.6", features = ["pem", "x509-parser"] }
regex = "1.12.2"
reqwest = { version = "0.13.1", features = ["socks"] }
serde = "1.0.228"
serde_json = "1.0.149"
socks5-server = "0.10.1"
socket2 = { version = "0.6.1", features = ["all"] }
thiserror = "2.0.17"
time = "0.3.45"
tokio = { version = "1.49.0", features = ["full"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }

[dev-dependencies]
clap = { version = "4.5.54", features = ["derive"] }
test-log = "0.2.19"

[lints.clippy]
collapsible_else_if = "allow"
collapsible_if = "allow"
disallowed_macros = "warn"
module_inception = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
while_let_loop = "allow"
