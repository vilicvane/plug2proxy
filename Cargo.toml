[package]
name = "plug2proxy"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
color-backtrace = "0.7.2"
colored = "3.0.0"
console-subscriber = "0.5.0"
derive_more = { version = "2.1.1", features = ["full"] }
env_logger = "0.11.8"
flume = "0.12.0"
futures = "0.3.31"
lits = "0.3.1"
log = { version = "0.4.29", features = ["release_max_level_info"] }
lowkit.path = "../lowkit"
pem = "3.0.6"
postcard = "1.1.3"
quiche = "0.24.7"
rand = "0.9.2"
rcgen = { version = "0.14.6", features = ["pem", "x509-parser"] }
serde = "1.0.228"
thiserror = "2.0.17"
time = "0.3.44"
tokio = { version = "1.49.0", features = ["full"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }

[dev-dependencies]
ctor = "0.6.3"
ntest = "0.9.5"
test-log = "0.2.19"
tokio-quiche = "0.13.0"

[lints.clippy]
collapsible_else_if = "allow"
collapsible_if = "allow"
disallowed_macros = "warn"
module_inception = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
while_let_loop = "allow"
