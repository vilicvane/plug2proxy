type: hub
id: hub-main
listen: "127.0.0.1:8765"
cert_path: "certs/cert.pem"
key_path: "certs/key.pem"
connection_count: 4

routes:
  # Using IP-based routing (fake-ip DNS in your network)
  # These IPs are from your DNS resolver's fake-ip range
  - pattern: "198.18.0.1"     # google.com
    tag: "us"
  - pattern: "198.18.5.78"    # Another common fake-ip
    tag: "jp"
  - pattern: "198.18"         # Match all fake-ip range for US
    tag: "us"
  - pattern: "198.19"         # Another fake-ip range
    tag: "cn"
